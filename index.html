<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PiggyBank — weight &amp; pig-out tracker</title>
<meta name="description" content="A friendly calendar for logging your weight and stamping the days you pigged out.">
<meta name="theme-color" content="#EDDCC6">
<link rel="icon" href="assets/small-pig.png">
<link rel="apple-touch-icon" href="assets/big-pig.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PiggyBank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="stage">
  <div class="phone">

    <div class="statusbar">
      <span id="clock">9:41</span>
      <div class="notch"></div>
      <div class="statusbar__icons">
        <svg width="17" height="13" viewBox="0 0 18 13" fill="currentColor" aria-hidden="true"><rect x="0" y="9" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1"/></svg>
        <div class="battery"><i></i></div>
      </div>
    </div>

    <!-- Calendar view -->
    <section class="view" id="view-cal">
      <header class="head">
        <div>
          <h1 class="logo">Piggy<span>Bank</span></h1>
          <p class="tagline">weight &amp; pig-out tracker</p>
        </div>
        <button class="icon-btn" id="btn-trends" title="Trends" aria-label="Show trends">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 13l4-4 3 3 5-6"/></svg>
        </button>
      </header>

      <div class="monthbar">
        <button class="nav-btn" id="btn-prev" aria-label="Previous month">‹</button>
        <div class="monthbar__label" id="month-label"></div>
        <button class="nav-btn" id="btn-next" aria-label="Next month">›</button>
      </div>

      <div class="weekdays" id="weekdays"></div>
      <div class="grid" id="grid"></div>

      <div class="spacer"></div>

      <p class="hint" id="hint"></p>
      <div class="picker">
        <button class="pig-btn" id="pick-big" aria-label="Big pig stamp">
          <span class="pig-slot pig-slot--big"><img id="img-big" alt=""></span>
        </button>
        <button class="pig-btn" id="pick-small" aria-label="Small pig stamp">
          <span class="pig-slot pig-slot--small"><img id="img-small" alt=""></span>
        </button>
      </div>
    </section>

    <!-- Trends view -->
    <section class="view view--scroll" id="view-trends" hidden>
      <header class="head head--back">
        <button class="icon-btn icon-btn--back" id="btn-back" aria-label="Back to calendar">‹</button>
        <div>
          <h1 class="logo logo--sm">Trends</h1>
          <p class="tagline" id="trends-month"></p>
        </div>
      </header>

      <div class="stats">
        <div class="card stat">
          <div class="stat__label">Latest</div>
          <div class="stat__value" id="stat-latest">—<small> kg</small></div>
        </div>
        <div class="card stat">
          <div class="stat__label">Net change</div>
          <div class="stat__value" id="stat-change">—<small> kg</small></div>
        </div>
        <div class="card stat stat--row">
          <img class="stat__pig" id="img-big-2" alt="">
          <div><div class="stat__count" id="stat-big">0</div><div class="stat__sub">big pigs</div></div>
        </div>
        <div class="card stat stat--row">
          <img class="stat__pig stat__pig--sm" id="img-small-2" alt="">
          <div><div class="stat__count" id="stat-small">0</div><div class="stat__sub">small pigs</div></div>
        </div>
      </div>

      <div class="card chart-card">
        <div class="chart-card__title">Weight &amp; last pigs</div>
        <div class="chart">
          <div class="chart__axis" id="y-axis"></div>
          <div class="chart__scroll">
            <div id="chart-inner"></div>
          </div>
        </div>
        <div class="legend" id="legend"><span class="legend__swatch"></span>weight (interpolated)</div>
      </div>
      <p class="note" id="note">Days without a logged weight are joined by a continuous line. Scroll the chart to see the whole month.</p>
    </section>

    <!-- Weight modal -->
    <div class="overlay" id="overlay" hidden>
      <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-date">
        <div class="modal__kicker">Log weight</div>
        <div class="modal__date" id="modal-date"></div>
        <label class="field">
          <input type="number" step="0.1" inputmode="decimal" id="weight-input" placeholder="0.0" aria-label="Weight in kilograms">
          <span>kg</span>
        </label>
        <div class="modal__actions">
          <button class="btn-clear" id="btn-clear" hidden>Clear</button>
          <button class="btn-save" id="btn-save">Save</button>
        </div>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
